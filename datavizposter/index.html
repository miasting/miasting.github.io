<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menneske stammen</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <style>
    /* 
    GENERELT / BAGGRUND
    */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      color: #575757;
      font-family: Courier, "Times New Roman", serif;
    }

    #scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 
    OVERSKRIFT + BESKRIVELSE
   */
    .hud { 
      position: fixed;
      inset: 20px auto auto 22px;
      max-width: 360px;
      pointer-events: none; 
    }
    h1 { 
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 3.6rem);
      line-height: .92; font-weight: normal;
    }
    p { 
      margin: 0;
      color: #272727;
      line-height: 1.4; 
    }

        /* SØGEFELT*/
    .search { margin-top: 16px; width: 260px; max-width: 100%; pointer-events: auto; border: 1px solid #ffffff; border-radius: 4px; padding: 10px 12px; background: #e8eae9; color: #5e5e5d; font: inherit; }
        /* EXPORT-KNAP */
    .export { margin-top: 8px; pointer-events: auto; border: 1px solid #ffffff; border-radius: 4px; padding: 9px 12px; background: #9ab194; color: #fffaf0; font: inherit; cursor: pointer; }
        /* TOOLTIP */
    .tooltip { position: fixed; display: none; z-index: 5; pointer-events: none; padding: 8px 10px; border: 1px solid #657568; border-radius: 4px; background: rgba(24, 35, 27, .94); color: #f3f0e7; font: 12px/1.35 ui-sans-serif, system-ui, sans-serif; }
        /*FARVEFORKLARING */
    .key { position: fixed; right: 22px; bottom: 20px; color: #b5c1b7; font: 12px/1.7 ui-sans-serif, system-ui, sans-serif; text-align: right; }
    .key b { color: #f3f0e7; }
        /* STATUS-TEKST*/
    .status { position: fixed; left: 22px; bottom: 20px; color: #b5c1b7; font: 12px ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hud"><h1>Mias mennesker<br>– en stamme</h1><p>Højden er alder.<br>Mia er linjen i centrum.<br>Hver linje er et menneske;<br>distancen til centrum er tæthed.<br>Fremmede er skjulte;<br>døde forsvinder ind i kernen.</p><input id="search" class="search" type="search" placeholder="Søg på navn" aria-label="Search a name"><button id="export-png" class="export" type="button">Export A2 PNG, 300 dpi</button></div>
  <div class="status" id="status">Loading data...</div>
  <div class="key"><b>0</b> core &nbsp; <b>1-5</b> relationships &nbsp; <b>6</b> stranger hidden &nbsp; <b>7</b> death</div>
  <div class="tooltip" id="tooltip"></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import { Line2 } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/Line2.js";
    import { LineGeometry } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineGeometry.js";
    import { LineMaterial } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineMaterial.js";

    const canvas = document.querySelector("#scene");
    const status = document.querySelector("#status");
    const search = document.querySelector("#search");
    const tooltip = document.querySelector("#tooltip");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, .1, 200);
    camera.position.set(16, 14, 19);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 8, 0);
    controls.enableDamping = true;
    controls.minDistance = 8;
    controls.maxDistance = 50;

    const raycaster = new THREE.Raycaster();
    raycaster.params.Line.threshold = .25;
    const pointer = new THREE.Vector2();

    scene.add(new THREE.HemisphereLight(0xdfe8d9, 0x182019, 2));
    const cylinderHeight = 16;
    const cylinderRadius = 5;
    const ageMax = 26;
    const root = new THREE.Group();
    scene.add(root);
    const bornPeople = new Set([
      "Mia|MIG",
      "Freja|Familie",
      "Nikolaj|Familie",
      "Frederik|Familie",
      "Kasper|Familie",
      "Mathias|Familie",
      "Ella|Familie",
      "Sigrid|Familie",
      "Mor|Familie",
      "Far|Familie",
      "Baka Nena|Familie",
      "Stara Baka|Familie",
      "Dundo|Familie",
      "Dida Zlatko|Familie",
      "Teta Mini|Familie",
      "Laura Byskov|Familie",
      "Farmor|Familie",
      "Farfar|Familie",
      "Anika|Familie",
      "Carl|Familie"
    ]);

    /* GITTER START  */
    const cylinder = new THREE.Mesh(
      new THREE.CylinderGeometry(cylinderRadius, cylinderRadius, cylinderHeight, 64, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xa9bcaa, transparent: true, opacity: .3, wireframe: true })
    );
    cylinder.position.y = cylinderHeight / 2;
    root.add(cylinder);

    for (let age = 0; age <= ageMax; age++) {
      const ring = new THREE.LineLoop(
        new THREE.CircleGeometry(cylinderRadius, 64),
        new THREE.LineBasicMaterial({ color: 0x73877a, transparent: true, opacity: .05 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = age / ageMax * cylinderHeight;
      root.add(ring);
    }

    /*GITTER SLUT*/

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/);
      const headers = lines.shift().split(",");
      return lines.map(line => {
        const values = line.split(",");
        return Object.fromEntries(headers.map((header, index) => [header, values[index] ?? ""]));
      });
    }

    function hash(value) {
      let result = 0;
      for (const character of value) result = (result * 31 + character.charCodeAt(0)) >>> 0;
      return result;
    }

    function colorFor(place, name) {
         // 🩷 KÆRLIGHEDSRELATIONER
        if (name === "Nor" && place === "OD") {
          return new THREE.Color(0xffb3d9);
        }

        if (name === "Oscar" && place === "BRSB") {
                  return new THREE.Color(0xffb3d9);
        }

        if (name === "Philip " && place === "CG") {
                  return new THREE.Color(0xffb3d9);
        }
        
        const colors = {
        // ❤️ MIG / FAMILIE
          "MIG": 0xff0000,
          "Familie": 0xff8484,
          "Familie venner": 0xffcc00,

          // 💚 VENNERS VENNER — mere mat grøn
          "Lukas": 0x4d994d,
          "Balthazar": 0x669966,
          "Anton": 0x3d803d,
          "Noah": 0x558855,
          "Dea": 0x709f70,
          "Nor": 0xffb3d9,
          "Henriette": 0x467a46,

          // 🩵 FRIVILLIGT ARBEJDE — turkis
          "DGUB": 0x00cccc,
          "DFUNK": 0x00b3b3,
          "OD": 0x00e6cc,
          "Beboerhuset": 0x20c9a6,
          "Vietnam": 0x00a6a6,
          "Film": 0x33d6cc,

          // 💙 SKOLE — lyseblå
          "DMJX": 0x66ccff,
          "Skoleskibet": 0x66b3ff,
          "LPS": 0x80d4ff,
          "CG": 0x4dc3ff,
          "TG": 0x99ddff,
          "Krogerup": 0x99ddff,

          // 🔵 ARBEJDE — mere mat blå
          "BRSB": 0x467a9e,
          "Ingolfs": 0x527f99,
          "DGI": 0x3f6f8f,

          // 💛 SPORT/Hobby — gul
          "AVK": 0x8FCE00,
          "MK31": 0x8FCE00,
          "30B": 0x8FCE00,

          // 💜 BOLIG / TERAPI / BØRNEHAVE — lilla
          "GJK": 0xb366ff,
          "FS Rosa": 0xcc99ff,
          "Nor": 0xcc99ff,
          "LMS": 0x9966cc
        };

      return new THREE.Color(colors[place] ?? 0xffffff);
    }

    function pointFor(row, age) {
      const value = Number(row.Closeness);
      const baseRadius = value === 7 ? 0 : value <= 5 ? value : 5 + (value - 5) * 1.8;
      const placeAngle = hash(row.Sted) % 360;
      const personOffset = ((hash(row.Navn) % 100) / 100 - .5) * 46;
      const angle = (placeAngle + personOffset) * Math.PI / 180;
      const jitter = value === 0 ? ((hash(`${row.Navn}-${age}`) % 100) / 100 - .5) * .12 : 0;
      return new THREE.Vector3(
        Math.cos(angle) * (baseRadius + jitter),
        age / ageMax * cylinderHeight,
        Math.sin(angle) * (baseRadius + jitter)
      );
    }

    function addPeople(rows) {
      const people = new Map();
      for (const row of rows) {
        const key = `${row.Navn}|${row.Sted}`;
        if (!people.has(key)) people.set(key, []);
        people.get(key).push(row);
      }
      let sequence = 0;
      for (const [key, personRows] of people) {
        const ordered = personRows.sort((a, b) => Number(a.Age) - Number(b.Age));
        const firstKnownIndex = ordered.findIndex(row => Number(row.Closeness) <= 5);
        if (firstKnownIndex < 0) continue;
        const born = bornPeople.has(key) || ordered.slice(0, firstKnownIndex).some(row => Number(row.Closeness) === 8);
        const entryPoints = [];
        if (!born) {
          const entryRow = { ...ordered[firstKnownIndex], Closeness: 5 };
          entryPoints.push(pointFor(entryRow, Number(entryRow.Age)));
        }
        const visibleRows = ordered.slice(firstKnownIndex).filter(row => Number(row.Closeness) !== 6);
        const deathIndex = visibleRows.findIndex(row => Number(row.Closeness) === 7);
        const livingRows = deathIndex >= 0 ? visibleRows.slice(0, deathIndex) : visibleRows;
        const livingPoints = entryPoints.concat(livingRows.map(row => pointFor(row, Number(row.Age))));
        const color = colorFor(ordered[0].Sted, ordered[0].Navn);
        
        /* Herunder kan du ændre linjens tykkelse ved linewidth */
        function addPersonLine(points, opacity, dashed) {
          if (points.length < 2) return;
          const curvePoints = ordered[0].Sted === "MIG"
            ? [
              new THREE.Vector3(0, points[0].y, 0),
              new THREE.Vector3(0, points[points.length - 1].y, 0)
            ]
            : new THREE.CatmullRomCurve3(points).getPoints(Math.max(24, points.length * 8));
          const geometry = new LineGeometry();
          geometry.setPositions(curvePoints.flatMap(point => [point.x, point.y, point.z]));
          const material = dashed
            ? new LineMaterial({ color, transparent: true, opacity, linewidth: 1.8, dashed: true, dashSize: .28, gapSize: .16, resolution: new THREE.Vector2(window.innerWidth, window.innerHeight) })
            : new LineMaterial({ color, transparent: true, opacity, linewidth: 1.4, resolution: new THREE.Vector2(window.innerWidth, window.innerHeight) });
          const line = new Line2(geometry, material);
          line.computeLineDistances();
          line.userData.isPerson = true;
          line.userData.name = ordered[0].Navn;
          line.userData.place = ordered[0].Sted;
          line.userData.baseOpacity = opacity;
          root.add(line);
        }

        addPersonLine(livingPoints, .94, false);
        if (deathIndex >= 0 && livingPoints.length) {
          const deathPoint = pointFor(visibleRows[deathIndex], Number(visibleRows[deathIndex].Age));
          addPersonLine([livingPoints[livingPoints.length - 1], deathPoint], .42, true);
        }
        sequence += 1;
      }
      status.textContent = `${people.size} people plotted; drag to rotate, scroll to zoom`;
    }

    search.addEventListener("input", () => {
      const query = search.value.trim().toLowerCase();

      // Find evt. sted i parentes: (OD), (DMJX), (Familie) osv.
      const places = [...query.matchAll(/\(([^)]+)\)/g)]
        .map(match => match[1].trim().toLowerCase());

      // Fjern stedet fra resten af søgningen
      const nameQuery = query.replace(/\([^)]+\)/g, "").trim();

      // Flere navne adskilt af mellemrum
      const names = nameQuery.split(/\s+/).filter(Boolean);

      let matches = 0;

      root.children.forEach(child => {
        if (!child.userData.isPerson) return;

        const name = child.userData.name.toLowerCase();
        const place = child.userData.place.toLowerCase();

        // Match på navn
        const nameMatch =
          names.length === 0 ||
          names.some(searchName => name.includes(searchName));

        // Match på sted
        const placeMatch =
          places.length > 0 &&
          places.includes(place);

        let match;
/* Her er det andet fra chatten
        if (places.length > 0 && names.length === 0) {
          // Kun sted: (CG)
          match = placeMatch;
        } else if (places.length > 0 && names.length > 0) {
          // Navn + sted: Nor (OD)
          match = nameMatch && placeMatch;
        } else {
          // Kun navn: Nor
          match = nameMatch;
        }
*/

        if (places.length > 0) {
          // Alt fra de valgte steder + de valgte navne
          match = nameMatch || placeMatch;
        } else {
          // Kun navn
          match = nameMatch;
        }


        child.material.opacity = match
          ? child.userData.baseOpacity
          : .025;

        if (match) matches += 1;
      });

  status.textContent = query
    ? `${matches} matching people; drag to rotate, scroll to zoom`
    : "201 people plotted; drag to rotate, scroll to zoom";
});

    document.querySelector("#export-png").addEventListener("click", () => {
      const exportWidth = 7016;
      const exportHeight = 4961;
      renderer.setPixelRatio(1);
      renderer.setSize(exportWidth, exportHeight, false);
      camera.aspect = exportWidth / exportHeight;
      camera.updateProjectionMatrix();
      root.children.forEach(child => {
        if (child.userData.isPerson && child.material.resolution) child.material.resolution.set(exportWidth, exportHeight);
      });
      /* Indsatte det her */ 
      root.children.forEach(child => {
        if (child.userData.isPerson && child.material.linewidth) {
          child.userData.exportLinewidth = child.material.linewidth;
          child.material.linewidth *= 8;
        }
      });

      renderer.render(scene, camera);
      
      /* og det her */ 
      root.children.forEach(child => {
        if (child.userData.isPerson && child.userData.exportLinewidth) {
          child.material.linewidth = child.userData.exportLinewidth;
          delete child.userData.exportLinewidth;
        }
      });
      /* for at ændre tykkelse på linjer  */ 

      renderer.domElement.toBlob(blob => {
        if (blob) {
          const link = document.createElement("a");
          link.download = "MenneskeStammen.png";
          link.href = URL.createObjectURL(blob);
          link.click();
          URL.revokeObjectURL(link.href);
        }
        resize();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }, "image/png");
    });

    canvas.addEventListener("pointermove", event => {
      const bounds = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
      pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const personLines = root.children.filter(child => child.userData.isPerson);
      const hit = raycaster.intersectObjects(personLines, false)[0];
      if (!hit) {
        tooltip.style.display = "none";
        return;
      }
      tooltip.innerHTML = `<strong>${hit.object.userData.name}</strong><br>${hit.object.userData.place}`;
      tooltip.style.left = `${event.clientX + 14}px`;
      tooltip.style.top = `${event.clientY + 14}px`;
      tooltip.style.display = "block";
    });
    canvas.addEventListener("pointerleave", () => { tooltip.style.display = "none"; });

    fetch("Mennesker-Alder-Tæthedsværdi_long_births_v01.csv")
      .then(response => response.text())
      .then(text => {
        const unique = new Map();
        for (const row of parseCsv(text)) unique.set(`${row.Navn}|${row.Sted}|${row.Age}`, row);
        addPeople([...unique.values()]);
      })
      .catch(() => { status.textContent = "Could not load the CSV. Start the local server in this folder."; });

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      root.children.forEach(child => {
        if (child.userData.isPerson && child.material.resolution) child.material.resolution.set(width, height);
      });
    }
    window.addEventListener("resize", resize);
    resize();

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
