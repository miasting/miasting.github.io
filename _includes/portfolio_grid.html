<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <!-- Other meta tags and links -->

    <!-- Inline CSS for Portfolio Grid -->
    <style>
        #portfolio {
            padding: 0; /* Removes any extra padding around the section */
        }

        .portfolio-item img {
            width: 100%;  /* Make the images take up 100% of the column's width */
            height: auto; /* Ensure the images maintain their aspect ratio */
        }

        /* Optional: If you want to remove any margin/padding from the .row */
        .row.no-gutters {
            margin-left: 0;
            margin-right: 0;
        }
    </style>
</head>
<body>

    <!-- Portfolio Grid Section -->
    <section id="portfolio" class="bg-light-gray">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12 text-center">
                    <h2 class="section-heading">Portfolio</h2>
                    <h3 class="section-subheading text-muted">Jeg laver film, grafitti-stencils, tegninger, layouts, fonts og digitale illustrationer</h3>
                </div>
            </div>
            <div class="row no-gutters"> <!-- This removes the gutter space between columns -->
                {% for post in site.posts %}
                    <div class="col-12 col-md-4 portfolio-item">
                        <a href="#portfolioModal{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
                            <div class="portfolio-hover">
                                <div class="portfolio-hover-content">
                                    <h4>{{ post.title }}</h4>
                                    <p>{{ post.subtitle }}</p>
                                </div>
                            </div>
                            <img src="img/portfolio/{{ post.thumbnail }}" class="img-fluid" alt="">
                        </a>
                    </div>
                {% endfor %}
            </div>
        </div>
    </section>

</body>
</html>
